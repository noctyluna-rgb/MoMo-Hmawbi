‎name: Build Mo Mo Hmawbi APK
‎
‎on:
‎  workflow_dispatch:
‎  push:
‎    paths:
‎      - '*.zip'
‎      - '.github/workflows/android.yml'
‎
‎jobs:
‎  build:
‎    runs-on: ubuntu-latest
‎
‎    steps:
‎      - name: Checkout repository
‎        uses: actions/checkout@v4
‎
‎      - name: Set up Java
‎        uses: actions/setup-java@v4
‎        with:
‎          distribution: temurin
‎          java-version: '17'
‎
‎      - name: Set up Android SDK
‎        uses: android-actions/setup-android@v4
‎        with:
‎          packages: 'platform-tools'
‎
‎      - name: Find latest ZIP
‎        run: |
‎          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
‎          if [ -z "$ZIP_FILE" ]; then
‎            echo "No ZIP file found in repository root"
‎            exit 1
‎          fi
‎          echo "Using ZIP: $ZIP_FILE"
‎          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
‎
‎      - name: Extract Android project
‎        run: |
‎          mkdir extracted
‎          unzip -q "$ZIP_FILE" -d extracted
‎          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
‎          if [ -z "$PROJECT_DIR" ]; then
‎            echo "settings.gradle.kts not found"
‎            exit 1
‎          fi
‎          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
‎
‎      - name: Build debug APK
‎        run: |
‎          cd "$PROJECT_DIR"
‎          gradle --no-daemon assembleDebug
‎
‎      - name: Upload APK
‎        uses: actions/upload-artifact@v4
‎        with:
‎          name: MoMoHmawbi-APK
‎          path: extracted/**/build/outputs/apk/debug/*.apk
‎          if-no-files-found: error
