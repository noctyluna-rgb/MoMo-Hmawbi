
name: Build MoMo Hmawbi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          PROP="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP" ]; then
            VERSION=$(grep distributionUrl "$PROP" | sed -E 's/.*gradle-([0-9.]+)-(all|bin)\.zip.*/\1/')
          else
            VERSION="8.9"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"
          echo "Gradle: $VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.version }}

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          find "${{ steps.project.outputs.dir }}" \
            -type f -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoMo-Hmawbi-APK
          path: dist/*.apk
          retention-days: 1
